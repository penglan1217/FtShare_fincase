name: Deploy FtShare intraday collector

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure FtShare API secret
        env:
          FTSHARE_API_KEY: ${{ secrets.FTSHARE_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$FTSHARE_API_KEY"
          printf '%s' "$FTSHARE_API_KEY" | npx wrangler secret put FTSHARE_API_KEY --config config/intraday-worker.cloudflare.jsonc

      - name: Deploy scheduled collector
        run: npx wrangler deploy --config config/intraday-worker.cloudflare.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
