name: Deploy FtShare intraday collector

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Cloudflare API token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          case "$CLOUDFLARE_API_TOKEN" in
            cfat_*)
              verify_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens/verify"
              token_type="account"
              ;;
            cfut_*)
              verify_url="https://api.cloudflare.com/client/v4/user/tokens/verify"
              token_type="user"
              ;;
            *)
              echo "Unrecognized token prefix. Check that the complete Cloudflare API Token was saved in CLOUDFLARE_API_TOKEN."
              exit 1
              ;;
          esac
          echo "Checking Cloudflare ${token_type} API token."
          response="$(curl --silent --show-error --request GET "$verify_url" --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
          printf '%s' "$response" | node -e '
            let body = "";
            process.stdin.on("data", chunk => body += chunk);
            process.stdin.on("end", () => {
              let data;
              try { data = JSON.parse(body); } catch {
                console.error("Cloudflare returned an unreadable verification response.");
                process.exit(1);
              }
              if (!data.success || data.result?.status !== "active") {
                console.error("Cloudflare API token verification failed:", JSON.stringify(data.errors || data));
                process.exit(1);
              }
              console.log("Cloudflare API token is active.");
            });
          '

      - name: Configure FtShare API secret
        env:
          FTSHARE_API_KEY: ${{ secrets.FTSHARE_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$FTSHARE_API_KEY"
          printf '%s' "$FTSHARE_API_KEY" | npx wrangler secret put FTSHARE_API_KEY --config config/intraday-worker.cloudflare.jsonc

      - name: Deploy scheduled collector
        run: npx wrangler deploy --config config/intraday-worker.cloudflare.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
