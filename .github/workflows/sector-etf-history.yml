name: 15只行业ETF历史行情采集

on:
  workflow_dispatch:
    inputs:
      end_date:
        description: "回测行情截止日（YYYY-MM-DD，留空则使用最近已完成交易日）"
        required: false
        type: string

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate configuration and tests
        run: npm test

      - name: Collect historical ETF candles
        env:
          FTSHARE_API_KEY: ${{ secrets.FTSHARE_API_KEY }}
          SECTOR_ETF_END_DATE: ${{ inputs.end_date }}
        run: |
          if [ -z "$FTSHARE_API_KEY" ]; then
            echo "::error::请先在仓库 Secrets 中配置 FTSHARE_API_KEY。"
            exit 1
          fi
          npm run collect:sector-etfs

      - name: Upload private history archive
        uses: actions/upload-artifact@v4
        with:
          name: sector-etf-backtest-history
          path: |
            data/private/sector-etf-backtest.json.gz
            data/private/sector-etf-backtest.manifest.json
          if-no-files-found: error
          retention-days: 30
