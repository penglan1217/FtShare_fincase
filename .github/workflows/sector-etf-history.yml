name: 15只行业ETF四线趋势历史回测

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sector-etf-history.yml"
      - "scripts/collect_and_backtest_sector_etfs.py"
      - "config/sector-backtest-etfs.json"
  workflow_dispatch:
    inputs:
      end_date:
        description: "行情截止日 YYYY-MM-DD；留空则自动使用中国当前日期"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sector-etf-backtest
  cancel-in-progress: false

jobs:
  collect-and-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate script
        run: python -m py_compile scripts/collect_and_backtest_sector_etfs.py

      - name: Fetch public ETF history and run four-MA backtest
        env:
          END_DATE: ${{ inputs.end_date }}
        run: |
          if [ -n "$END_DATE" ]; then
            python scripts/collect_and_backtest_sector_etfs.py --start 2020-01-01 --end "$END_DATE"
          else
            python scripts/collect_and_backtest_sector_etfs.py --start 2020-01-01
          fi

      - name: Upload full history, trades and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sector-etf-four-ma-backtest
          path: artifacts/sector-etf-backtest/
          if-no-files-found: warn
          retention-days: 30
